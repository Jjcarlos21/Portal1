<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <script id="tailwind-config">
       tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#f43625" },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>

    <style>
        html, body { min-height: 100vh; margin: 0; padding: 0; }
        body {
            background-image: url('fondo_pagina.png') !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            background-color: transparent !important;
        }
    </style>

    <title>Kizuna Venezuela - Directorio Nacional de Judo</title>
</head>
<body class="font-display text-slate-900 dark:text-slate-100 transition-colors duration-300 relative min-h-screen">

<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md text-white shadow-lg border-b border-primary/20">
        <div class="w-full px-6 lg:px-20 py-3 flex items-center justify-between">
            <h1 class="text-lg font-extrabold tracking-tight">Kizuna Venezuela</h1>
            <div class="flex items-center gap-6">
                <button id="mobileMenuBtn" class="md:hidden flex items-center justify-center w-9 h-9 rounded-lg hover:bg-white/10 transition-colors" aria-label="Abrir menú" aria-expanded="false">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <nav class="hidden md:flex items-center gap-6">
                    <a class="text-sm font-semibold hover:text-primary transition-colors" href="index.html">Inicio</a>
                    <a class="text-sm font-semibold hover:text-primary transition-colors" href="javascript:history.back()">Volver</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="mx-auto w-full max-w-7xl px-6 py-12">
        <section class="mb-4 flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
            <div class="w-full">
                <h2 class="mb-4 text-4xl lg:text-5xl font-black leading-tight tracking-tight text-slate-900 dark:text-white whitespace-nowrap overflow-hidden text-ellipsis">
                   Directorio Nacional de Judo
                </h2>
            </div>
        </section>

        <section class="mb-20" id="directorio">
            <div class="p-8 text-center text-slate-700 dark:text-slate-300">
                <p>Cargando base de datos...</p>
            </div>
        </section>
    </main>

    <footer class="bg-slate-950/90 backdrop-blur-md text-white py-4 text-center border-t border-slate-800 mt-auto">
        <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-2 text-xs">
            <div>
                <span class="font-black text-sm">Kizuna Venezuela</span>
                <span class="text-slate-400 ml-2 hidden sm:inline">| Difusión y preservación de la cultura japonesa en Venezuela.</span>
            </div>
            <div class="text-slate-500">
                © 2026 Kizuna Venezuela. Todos los derechos reservados.
            </div>
        </div>
    </footer>
</div>

<script>
function normalizarTexto(str) {
    if (!str) return "";
    return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function ajustarRuta(ruta) {
    if (!ruta) return '';
    if (ruta.startsWith('http://') || ruta.startsWith('https://') || ruta.startsWith('/')) {
        return ruta;
    }
    return '/' + ruta;
}

function moverFoto(id, direccion) {
    const contenedor = document.getElementById(`carrusel-${id}`);
    if (!contenedor) return;

    const fotos = JSON.parse(contenedor.dataset.fotos || '[]');
    let actual = parseInt(contenedor.dataset.index || '0', 10);

    actual += direccion;
    if (actual < 0) actual = fotos.length - 1;
    if (actual >= fotos.length) actual = 0;

    contenedor.dataset.index = actual;
    const imgElement = contenedor.querySelector('.carrusel-img');
    if (imgElement) {
        imgElement.src = fotos[actual];
    }

    const contadorElement = contenedor.querySelector('.carrusel-contador');
    if (contadorElement) {
        contadorElement.innerText = `${actual + 1}/${fotos.length}`;
    }
}

function generarTarjeta(item, indexId) {
    const nombre = item.nombre || item.institucion || item.organizacion || item.entidad || 'Sin nombre';
    const zona = item.zona || item.sector || item.municipio || item.ciudad || '';
    const direccion = item.direccion || item.dir || 'Dirección no especificada';
    
    const telf1 = item.telefono1 || item.telefono || item.telf || '';
    const telf2 = item.telefono2 || item.celular || '';

    const logo = ajustarRuta(item.logo);
    
    const fotos = [
        ajustarRuta(item.foto1),
        ajustarRuta(item.foto2),
        ajustarRuta(item.foto3),
        ajustarRuta(item.foto4)
    ].filter(f => f && f.length > 0);

    const instagram = item.instagram || item.ig || '';
    const facebook = item.facebook || item.fb || '';
    const x = item.x || item.twitter || '';
    const webpage = item.webpage || item.web || item.url || '';
    const email = item.email || item.correo || '';

    return `
        <div class="flex flex-col justify-between gap-4 rounded-xl bg-white/90 p-5 shadow-md border border-slate-300 dark:bg-slate-900/90 dark:border-slate-800 transition-all hover:shadow-lg backdrop-blur-md">
            <div class="flex flex-col sm:flex-row gap-4 justify-between">
                <div class="flex-1 flex flex-col gap-3">
                    <div class="flex items-start gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <div class="h-16 w-16 shrink-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex items-center justify-center overflow-hidden">
                            ${logo ? `<img src="${logo}" alt="Logo ${nombre}" class="h-full w-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'material-symbols-outlined text-3xl text-primary\'>school</span>';">` 
                                   : `<span class="material-symbols-outlined text-3xl text-primary">school</span>`}
                        </div>
                        <div class="flex flex-col">
                            <h5 class="text-lg font-bold leading-tight text-slate-900 dark:text-white">${nombre}</h5>
                            ${zona ? `
                            <div class="flex items-center gap-1 text-xs text-slate-600 dark:text-slate-400 mt-1 font-semibold">
                                <span class="material-symbols-outlined text-[15px] text-primary">location_on</span>
                                <span>${zona}</span>
                            </div>` : ''}
                        </div>
                    </div>

                    <div class="relative group inline-block w-max">
                        <div class="flex items-center gap-1 text-sm font-bold text-primary cursor-pointer hover:underline">
                            <span class="material-symbols-outlined text-base">map</span>
                            <span>Dirección</span>
                        </div>
                        <div class="pointer-events-none absolute left-0 bottom-full mb-2 hidden w-64 rounded-md bg-slate-900 p-2.5 text-xs text-white shadow-lg group-hover:block group-hover:pointer-events-auto z-20 dark:bg-slate-100 dark:text-slate-900">
                            <p class="leading-snug">${direccion}</p>
                            <div class="absolute left-4 top-full -mt-1 border-4 border-transparent border-t-slate-900 dark:border-t-slate-100"></div>
                        </div>
                    </div>

                    <div class="flex items-start gap-2 pt-1">
                        <span class="material-symbols-outlined text-slate-600 dark:text-slate-400 text-2xl mt-0.5">call</span>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Telf.</span>
                            ${telf1 ? `<span class="text-xs text-slate-600 dark:text-slate-400 font-medium">${telf1}</span>` : ''}
                            ${telf2 ? `<span class="text-xs text-slate-600 dark:text-slate-400 font-medium">${telf2}</span>` : ''}
                            ${!telf1 && !telf2 ? `<span class="text-xs text-slate-400 italic">No disponible</span>` : ''}
                        </div>
                    </div>
                </div>

                ${fotos.length > 0 ? `
                <div id="carrusel-${indexId}" data-index="0" data-fotos='${JSON.stringify(fotos)}' class="relative w-full sm:w-44 h-36 shrink-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 overflow-hidden self-center sm:self-start group">
                    <img src="${fotos[0]}" alt="Foto de ${nombre}" class="carrusel-img h-full w-full object-cover">
                    ${fotos.length > 1 ? `
                        <button onclick="moverFoto('${indexId}', -1)" class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-primary text-white rounded-full w-6 h-6 flex items-center justify-center text-xs backdrop-blur-sm transition-colors z-10">‹</button>
                        <button onclick="moverFoto('${indexId}', 1)" class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-primary text-white rounded-full w-6 h-6 flex items-center justify-center text-xs backdrop-blur-sm transition-colors z-10">›</button>
                        <span class="carrusel-contador absolute bottom-1 right-1 bg-black/70 text-white text-[10px] px-1.5 py-0.5 rounded backdrop-blur-sm font-semibold">1/${fotos.length}</span>
                    ` : ''}
                </div>
                ` : ''}
            </div>

            <div class="flex items-center justify-start gap-4 border-t border-slate-200 dark:border-slate-800 pt-3 mt-1">
                ${instagram ? `<a href="${instagram}" target="_blank" title="Instagram" class="text-primary hover:opacity-80 transition-opacity"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163v.001c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.163 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>` : `<span title="No disponible" class="text-slate-300 dark:text-slate-700 pointer-events-none"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163v.001c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.163 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></span>`}
                ${x ? `<a href="${x}" target="_blank" title="X (Twitter)" class="text-primary hover:opacity-80 transition-opacity"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>` : `<span title="No disponible" class="text-slate-300 dark:text-slate-700 pointer-events-none"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>`}
                ${facebook ? `<a href="${facebook}" target="_blank" title="Facebook" class="text-primary hover:opacity-80 transition-opacity"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg></a>` : `<span title="No disponible" class="text-slate-300 dark:text-slate-700 pointer-events-none"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg></span>`}
                ${webpage ? `<a href="${webpage}" target="_blank" title="Sitio Web" class="text-primary hover:opacity-80 transition-opacity flex items-center"><span class="material-symbols-outlined text-xl">language</span></a>` : `<span title="No disponible" class="text-slate-300 dark:text-slate-700 pointer-events-none flex items-center"><span class="material-symbols-outlined text-xl">language</span></span>`}
                ${email ? `<a href="mailto:${email}" title="Enviar correo" class="text-primary hover:opacity-80 transition-opacity flex items-center"><span class="material-symbols-outlined text-xl">mail</span></a>` : `<span title="No disponible" class="text-slate-300 dark:text-slate-700 pointer-events-none flex items-center"><span class="material-symbols-outlined text-xl">mail</span></span>`}
            </div>
        </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const initSqlJs = window.initSqlJs;
        const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });

        const response = await fetch(`/data/kizuna.db?v=${new Date().getTime()}`);
        if (!response.ok) throw new Error('No se pudo acceder al archivo data/kizuna.db.');
        
        const arrayBuffer = await response.arrayBuffer();
        const uInt8Array = new Uint8Array(arrayBuffer);
        const db = new SQL.Database(uInt8Array);

        const query = "SELECT * FROM Directorio WHERE Judo = 1 OR judo = 1 OR JUDO = 1";
        const res = db.exec(query);

        if (res.length === 0 || !res[0].values.length) {
            document.getElementById('directorio').innerHTML = `
                <div class="p-8 text-center text-slate-700 dark:text-slate-300 border border-slate-300/40 dark:border-slate-800 rounded-xl my-8 bg-white/40 dark:bg-slate-900/40 backdrop-blur-sm">
                    <p class="text-lg">No se encontraron instituciones registradas para la práctica de Judo.</p>
                </div>`;
            return;
        }

        const rawColumns = res[0].columns;
        const columns = rawColumns.map(col => normalizarTexto(col));

        const registros = res[0].values.map(row => {
            let obj = {};
            columns.forEach((col, index) => { obj[col] = row[index]; });
            return obj;
        });

        const caracasRegistros = [];
        const agrupadoOtros = {};

        registros.forEach(item => {
            const c = normalizarTexto(item.ciudad);
            const e = normalizarTexto(item.estado);
            const z = normalizarTexto(item.zona);

            if (c === 'caracas' || e === 'caracas' || e === 'distrito capital' || z === 'caracas') {
                caracasRegistros.push(item);
            } else {
                const estado = item.estado || 'Otros Estados';
                const ciudad = item.ciudad || 'Otras Ciudades';

                if (!agrupadoOtros[estado]) agrupadoOtros[estado] = {};
                if (!agrupadoOtros[estado][ciudad]) agrupadoOtros[estado][ciudad] = [];

                agrupadoOtros[estado][ciudad].push(item);
            }
        });

        let htmlFinal = '';
        let contadorID = 0;

        if (caracasRegistros.length > 0) {
            htmlFinal += `
                <div class="mt-8 mb-6 border-b-2 border-primary/40 pb-2">
                    <h3 class="text-3xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-3xl">pin_drop</span>
                        Caracas
                    </h3>
                </div>
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 mb-12">`;

            caracasRegistros.forEach(item => {
                contadorID++;
                htmlFinal += generarTarjeta(item, contadorID);
            });

            htmlFinal += `</div>`;
        }

        const estadosOrdenados = Object.keys(agrupadoOtros).sort((a, b) => a.localeCompare(b));

        estadosOrdenados.forEach(estado => {
            htmlFinal += `
                <div class="mt-12 mb-6 border-b-2 border-primary/40 pb-2">
                    <h3 class="text-3xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-3xl">map</span>
                        Estado ${estado}
                    </h3>
                </div>`;

            const ciudadesOrdenadas = Object.keys(agrupadoOtros[estado]).sort((a, b) => a.localeCompare(b));

            ciudadesOrdenadas.forEach(ciudad => {
                htmlFinal += `
                    <h4 class="text-xl font-bold mb-4 mt-6 text-slate-900 dark:text-slate-100 flex items-center gap-2 pl-2 border-l-4 border-primary">
                        <span class="material-symbols-outlined text-primary">pin_drop</span>
                        ${ciudad}
                    </h4>
                    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 mb-8">`;

                agrupadoOtros[estado][ciudad].forEach(item => {
                    contadorID++;
                    htmlFinal += generarTarjeta(item, contadorID);
                });

                htmlFinal += `</div>`;
            });
        });

        document.getElementById('directorio').innerHTML = htmlFinal;

    } catch (err) {
        console.error(err);
        document.getElementById('directorio').innerHTML = `
            <div class="p-8 text-center text-red-600 dark:text-red-400 border border-red-300 dark:border-red-900/50 rounded-xl my-8 bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm">
                <p class="font-bold">Error al procesar la base de datos.</p>
                <p class="text-sm text-slate-600 dark:text-slate-400 mt-2">${err.message}</p>
            </div>`;
    }
});
</script>
<script src="/chatbot.js"></script>
</body>
